name: Build Aseprite (Windows only)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要编译的分支/标签/提交号（默认 main）'
        required: false
        default: 'main'
        type: string

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout Aseprite source (with submodules)
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Install Ninja
        uses: aseprite/get-ninja@main

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (auto download Skia + compile)
        shell: bash
        run: |
          bash build.sh --auto --norun

      - name: Bundle runtime DLLs (OpenSSL etc.)
        shell: pwsh
        run: |
          $bin = "build/bin"
          if (-not (Test-Path $bin)) { throw "build/bin not found" }

          Write-Host "== build/bin contents =="
          Get-ChildItem -Force $bin | Select-Object Name,Length

          # Try to find common runtime DLLs required by aseprite.exe and copy them next to the executable.
          $needed = @(
            "libcrypto-3-x64.dll","libssl-3-x64.dll",
            "libcrypto-1_1-x64.dll","libssl-1_1-x64.dll"
          )
          $searchRoots = @(
            "C:\Program Files\OpenSSL",
            "C:\OpenSSL",
            "C:\Strawberry",
            "C:\tools",
            "C:\vcpkg",
            "C:\Program Files\Git",
            "C:\Windows\System32"
          ) | Where-Object { Test-Path $_ }

          foreach ($name in $needed) {
            if (Test-Path (Join-Path $bin $name)) {
              Write-Host "Already present: $name"
              continue
            }
            $found = $null
            foreach ($root in $searchRoots) {
              $found = Get-ChildItem -Path $root -Filter $name -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { break }
            }
            if ($found) {
              Copy-Item $found.FullName -Destination $bin -Force
              Write-Host "Copied $name from $($found.FullName)"
            } else {
              Write-Host "Not found on runner: $name"
            }
          }

          Write-Host "== build/bin after bundling =="
          Get-ChildItem -Force $bin | Select-Object Name,Length

      - name: Upload build output
        uses: actions/upload-artifact@v5
        with:
          name: aseprite-windows-x64-${{ inputs.ref || 'main' }}
          path: build/bin/
          if-no-files-found: error
